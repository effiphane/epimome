<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虾铺开张中 · エピファネイア産駒データベース</title>
<style>
  :root{
    --bg:#f6f5f0;
    --card:#ffffff;
    --ink:#20261f;
    --muted:#7a8078;
    --line:#e5e3da;
    --brand:#1c4b32;
    --brand2:#0e2f1e;
    --gold:#b8912f;
    --gold-soft:#f3ecdb;
    --epi:#b8912f;   /* エピファネイア 金 */
    --effo:#2e86ab;  /* エフフォーリア 蓝 */
    --colt:#3b7bd4;  /* 牡 蓝 */
    --filly:#d4568a; /* 牝 粉 */
    --geld:#8a8f98;  /* セ 灰 */
    --shadow:0 4px 18px rgba(30,45,35,.08);
    --shadow-hover:0 12px 30px rgba(30,45,35,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"PingFang SC","Hiragino Sans","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}

  /* ===== 顶部 ===== */
  .hero{
    background:linear-gradient(140deg,#1c4b32 0%,#0e2f1e 55%,#0a2417 100%);
    color:#fff;padding:44px 20px 60px;text-align:center;position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(700px 240px at 18% 0%,rgba(184,145,47,.28),transparent 60%),
               radial-gradient(600px 220px at 82% 12%,rgba(46,134,171,.22),transparent 60%);
  }
  .tag{font-size:12px;letter-spacing:3px;opacity:.75;text-transform:uppercase}
  h1{font-size:38px;font-weight:800;letter-spacing:1px;margin-top:6px}
  .sub{opacity:.92;margin-top:8px;font-size:16px;font-weight:600}
  .sub .ja{color:#e6c469}
  .sub .effo{color:#7cc0e0}
  .sub .mid{opacity:.5;margin:0 4px}
  .stats{
    display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px;position:relative;z-index:1;
  }
  .stat{
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
    padding:9px 16px;border-radius:12px;font-size:13.5px;backdrop-filter:blur(4px);
  }
  .stat b{font-size:17px;margin-right:4px}
  .stat.epi{background:rgba(184,145,47,.2);border-color:rgba(230,196,105,.45)}
  .stat.epi b{color:#e6c469}
  .stat.effo b{color:#7cc0e0}
  .search-wrap{max-width:600px;margin:24px auto 0;position:relative;z-index:1}
  .search-wrap input{
    width:100%;padding:15px 20px 15px 48px;border:none;border-radius:100px;
    font-size:15.5px;outline:none;color:var(--ink);background:#fff;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .search-wrap .sicon{position:absolute;left:19px;top:50%;transform:translateY(-50%);opacity:.5;font-size:17px}

  /* ===== 工具栏 ===== */
  .toolbar{max-width:1180px;margin:-30px auto 0;padding:0 18px;position:relative;z-index:2}
  .panel{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px 20px}
  .frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .frow + .frow{margin-top:12px}
  .flabel{font-size:12.5px;color:var(--muted);font-weight:700;min-width:34px;letter-spacing:1px}
  .chip{
    border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:6px 13px;border-radius:100px;font-size:13px;cursor:pointer;
    transition:.14s;user-select:none;line-height:1.4;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip.active{background:var(--brand);border-color:var(--brand);color:#fff}
  select{
    border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:7px 10px;border-radius:9px;font-size:13px;cursor:pointer;max-width:200px;outline:none;
  }
  select:focus{border-color:var(--brand)}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);cursor:pointer;margin-left:4px}
  .chk input{accent-color:var(--brand);width:15px;height:15px}
  .spacer{flex:1}
  .btn-plain{
    border:1px solid var(--line);background:#fff;color:var(--muted);
    padding:7px 14px;border-radius:9px;font-size:13px;cursor:pointer;transition:.14s;
  }
  .btn-plain:hover{color:var(--brand);border-color:var(--brand)}

  /* ===== 控制条 ===== */
  .controls{max-width:1180px;margin:14px auto 0;padding:0 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .count{font-size:13.5px;color:var(--muted)}
  .count b{color:var(--brand)}
  .view-toggle{margin-left:auto;display:inline-flex;background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:4px}
  .view-toggle button{
    border:none;background:transparent;padding:7px 16px;border-radius:8px;
    font-size:13.5px;cursor:pointer;color:var(--muted);font-weight:600;transition:.14s;
  }
  .view-toggle button.active{background:var(--brand);color:#fff}

  /* ===== 表格 ===== */
  main{max-width:1180px;margin:16px auto 0;padding:0 18px}
  .table-wrap{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:1150px}
  thead th{
    position:sticky;top:0;background:var(--brand);color:#fff;text-align:left;
    padding:11px 12px;font-weight:600;white-space:nowrap;font-size:12.5px;letter-spacing:.5px;
  }
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.sortable:hover{background:#265c40}
  thead th .arr{opacity:.7;font-size:10px;margin-left:3px}
  tbody td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top;white-space:nowrap}
  tbody tr:hover{background:#faf9f5}
  tbody tr:nth-child(even){background:#fbfaf6}
  tbody tr:nth-child(even):hover{background:#f6f4ec}
  .nm{font-weight:700;font-size:13.5px}
  .en-col{color:#5a635c;font-size:13px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .dot.epi{background:var(--epi)}
  .dot.effo{background:var(--effo)}
  .sire-name{white-space:nowrap}
  .sex{display:inline-block;padding:1px 8px;border-radius:100px;font-size:12px;font-weight:700;color:#fff}
  .sex.colt{background:var(--colt)}
  .sex.filly{background:var(--filly)}
  .sex.geld{background:var(--geld)}
  .status{display:inline-block;padding:1px 8px;border-radius:100px;font-size:11px;font-weight:700;color:#fff;margin-left:5px;vertical-align:middle}
  .status.active{background:#0c7a3c}
  .status.retired{background:#6b7280}
  .status.breeding{background:var(--gold)}
  .status.local{background:#7c5cbf}
  .status.unregistered{background:#a0866b}
  .color-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle;border:1px solid rgba(0,0,0,.15)}
  .rec{font-weight:700}
  .rec.none{color:var(--muted);font-weight:400}
  .price{color:var(--muted);font-size:12px}

  /* ===== 卡片 ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:8px;transition:transform .16s,box-shadow .16s}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
  .card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
  .card .nm{font-size:16px;margin-top:2px}
  .card .en{color:var(--muted);font-size:12.5px;margin-top:-4px}
  .card dl{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;font-size:12.5px;margin-top:2px}
  .card dl div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0}
  .card dl dt{color:var(--muted);white-space:nowrap}
  .card dl dd{text-align:right;font-weight:600;overflow-wrap:anywhere}
  .card-foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
  .card-foot .price{font-size:11.5px}

  /* ===== 分页 ===== */
  .pagination{display:flex;align-items:center;justify-content:center;gap:16px;margin:20px 0;flex-wrap:wrap}
  .pagination button{background:var(--brand);color:#fff;border:none;padding:8px 18px;border-radius:9px;font-size:13.5px;cursor:pointer;font-weight:600}
  .pagination button:disabled{background:#c8ccc8;cursor:not-allowed}
  .pagination .page-info{font-size:13.5px;color:var(--muted)}
  .pagination .page-info b{color:var(--brand)}

  /* ===== 空状态 ===== */
  #empty{text-align:center;padding:80px 20px;color:var(--muted)}
  #empty .big{font-size:54px;margin-bottom:12px}
  #empty[hidden]{display:none}

  footer{text-align:center;color:var(--muted);font-size:12.5px;padding:34px 20px 42px}
  footer a{color:var(--brand)}

  /* ===== 更新日志 ===== */
  #changelog{display:none}
  body.show-log .hero,body.show-log .toolbar,body.show-log .controls,body.show-log main,body.show-log footer,body.show-log #detail{display:none}
  body.show-log #changelog{display:block}
  .log-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:7px 16px;border-radius:100px;font-size:13px;cursor:pointer;margin-top:16px}
  .log-btn:hover{background:rgba(255,255,255,.25)}
  .log-wrap{max-width:760px;margin:0 auto;padding:24px 20px 60px}
  .log-card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:26px}
  .log-card h2{font-size:22px;margin-bottom:4px}
  .log-card h3{font-size:15px;margin:18px 0 10px;color:var(--brand)}
  .log-list{list-style:none}
  .log-list li{padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;line-height:1.5}
  .log-date{display:inline-block;background:var(--gold-soft);color:#8a6d1f;font-size:12px;padding:1px 8px;border-radius:6px;margin-right:8px;font-weight:600}

  /* ===== 本周出马 ===== */
  #thisweek{display:none}
  body.show-tw .hero,body.show-tw .toolbar,body.show-tw .controls,body.show-tw main,body.show-tw footer,body.show-tw #detail,body.show-tw #changelog{display:none}
  body.show-tw #thisweek{display:block}
  .tw-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px}
  .tw-table th{text-align:left;background:var(--bg);padding:7px 10px;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
  .tw-table td{padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap}
  .tw-day{font-size:15px;color:var(--brand);margin:16px 0 8px;font-weight:700}
  .tw-name{color:var(--brand);font-weight:600;text-decoration:none}
  .tw-name:hover{text-decoration:underline}
  .tw-status{font-size:11px;color:var(--muted);margin-top:2px}

  /* ===== 详情页 ===== */
  #detail{display:none}
  body.show-detail .hero,body.show-detail .toolbar,body.show-detail .controls,body.show-detail main,body.show-detail footer{display:none}
  body.show-detail #detail{display:block}
  .detail-wrap{max-width:1600px;margin:0 auto;padding:24px 20px 60px}
  .detail-back{display:inline-block;background:var(--brand);color:#fff;border:none;padding:9px 18px;border-radius:10px;font-size:14px;cursor:pointer;margin-bottom:18px;font-weight:600}
  .detail-back:hover{background:var(--brand2)}
  .detail-card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:26px}
  .detail-head{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
  .detail-photo{flex:0 0 220px;max-width:220px}
  .detail-photo img{width:100%;border-radius:14px;box-shadow:var(--shadow);display:block;background:#f0efe9}
  .detail-main{flex:1;min-width:240px}
  .detail-main h2{font-size:26px;font-weight:800;line-height:1.25}
  .detail-main h2 .en{display:block;color:var(--muted);font-size:15px;font-weight:400;margin-top:2px}
  .detail-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .detail-info{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 26px;margin-top:16px}
  .info-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:8px 0;font-size:13.5px}
  .info-row dt{color:var(--muted)}
  .info-row dd{font-weight:600;text-align:right;overflow-wrap:anywhere}
  .detail-rec{font-size:18px;margin-top:14px}
  .detail-nk{display:inline-block;margin-top:14px;color:var(--brand);font-weight:600;font-size:14px}
  .detail-nk:hover{text-decoration:underline}
  .ped-box{margin-top:26px;border-top:1px solid var(--line);padding-top:20px;overflow-x:auto}
  .ped-box h3{font-size:16px;margin-bottom:14px}
  .ped-tree{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .ped-side{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fbfaf6}
  .ped-side-label{display:inline-block;background:var(--gold-soft);color:#8a6d1f;font-weight:700;font-size:12px;padding:2px 10px;border-radius:100px;margin-bottom:8px}
  .ped-side summary{cursor:pointer;font-size:13.5px;font-weight:600;list-style:none;padding:3px 0}
  .ped-side summary::-webkit-details-marker{display:none}
  .ped-side summary::before{content:'▸ ';color:var(--muted)}
  .ped-side details[open]>summary::before{content:'▾ '}
  .ped-side details details{margin-left:18px}
  .ped-side a{color:var(--ink);text-decoration:none}
  .ped-side a:hover{color:var(--brand);text-decoration:underline}
  .ped-tag{display:inline-block;color:#fff;font-size:11px;padding:1px 7px;border-radius:6px;margin-right:6px;vertical-align:middle}
  .ped-tag.f{background:var(--colt)}
  .ped-tag.m{background:var(--filly)}
  .ped-leaf{padding:2px 0 2px 18px;font-size:13px}
  .ped-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .ped-table th{padding:5px 10px;text-align:left;background:var(--bg);color:var(--muted);font-size:11.5px;font-weight:600;white-space:nowrap}
  .ped-table td{border:1px solid var(--line);padding:5px 10px;vertical-align:middle;white-space:nowrap}
  .ped-table a{color:var(--ink);text-decoration:none}
  .ped-table a:hover{color:var(--brand);text-decoration:underline}
  .ped-table td.side-s{background:#eef3fb}
  .ped-table td.side-d{background:#fbf0f4}
  .nm.link{cursor:pointer;color:var(--brand);white-space:nowrap}
  .nm.link:hover{text-decoration:underline}
  .card{cursor:pointer}
  .wins-box{margin-top:22px;border-top:1px solid var(--line);padding-top:18px;overflow-x:auto}
  .wins-box h3{font-size:15px;margin-bottom:10px}
  .wins-table{width:100%;border-collapse:collapse;font-size:13px}
  .wins-table th{text-align:left;background:var(--bg);padding:7px 10px;font-size:12px;color:var(--muted);font-weight:600}
  .wins-table td{padding:7px 10px;border-top:1px solid var(--line)}
  .wins-table tr.won-row td{background:var(--gold-soft);font-weight:700}

  @media (max-width:640px){
    h1{font-size:30px}
    .view-toggle{margin-left:0}
  }
</style>
</head>
<body>

  <header class="hero">
    <div class="tag">エピファネイア産駒データベース · Epiphaneia Progeny</div>
    <h1>🦐 虾铺开张中</h1>
    <div class="sub">店长 <span class="ja">エピファネイア</span>（Epiphaneia）<span class="mid">·</span> 息子 <span class="effo">エフフォーリア</span>（Efforia）</div>
    <div class="stats" id="stats"></div>
    <button class="log-btn" id="twBtn">🏇 本周出马</button>
    <button class="log-btn" id="logBtn">📋 更新日志</button>
    <div class="search-wrap">
      <span class="sicon">🔍</span>
      <input type="search" id="search" placeholder="搜索马名 / 英文名 / 母名 / 母父 / 牧场 / 马主 / 调教师…">
    </div>
  </header>

  <div class="toolbar">
    <div class="panel">
      <div class="frow">
        <span class="flabel">性别</span>
        <div id="sexChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
      </div>
      <div class="frow">
        <span class="flabel">毛色</span>
        <div id="colorChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
      </div>
      <div class="frow">
        <span class="flabel">年龄</span>
        <select id="ageSel"></select>
        <label class="chk"><input type="checkbox" id="winnerChk">只看已获胜</label>
        <span class="spacer"></span>
        <button class="btn-plain" id="resetBtn">↺ 重置筛选</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="count" id="count"></div>
    <div class="view-toggle">
      <button data-view="table" class="active">☰ 表格</button>
      <button data-view="card">▦ 卡片</button>
    </div>
  </div>

  <main>
    <div class="table-wrap" id="tableView">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="grid" id="cardView" hidden></div>
    <div id="empty" hidden>
      <div class="big">🔎</div>
      <div>没有找到匹配的产驹，换个条件试试吧。</div>
    </div>
    <div class="pagination" id="pagination" hidden>
      <button id="prevPage">← 上一页</button>
      <span class="page-info" id="pageInfo"></span>
      <button id="nextPage">下一页 →</button>
    </div>
  </main>

  <section id="detail">
    <div class="detail-wrap">
      <button class="detail-back" id="backBtn">← 返回列表</button>
      <div id="detailBody"></div>
    </div>
  </section>

  <section id="changelog">
    <div class="log-wrap">
      <button class="detail-back" id="logBackBtn">← 返回</button>
      <div class="log-card">
        <h2>📋 更新日志</h2>
        <div id="logBody"></div>
      </div>
    </div>
  </section>

  <section id="thisweek">
    <div class="log-wrap">
      <button class="detail-back" id="twBackBtn">← 返回</button>
      <div class="log-card">
        <h2>🏇 本周出马</h2>
        <div id="thisweekBody"></div>
      </div>
    </div>
  </section>

  <footer>
    虾铺开张中 · 数据来源：netkeiba.com<br>
    更新数据：改「种马数据.xlsx」后运行 <code>py build_site.py</code> 重新生成
  </footer>

<script src="data.js"></script>
<script src="updates.js"></script>
<script src="thisweek.js"></script>
<script>
  const data = 产驹数据;
  const PER_PAGE = 20;

  // ---------- 工具 ----------
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
      {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
    ));
  }
  function parseRec(rec){
    if(!rec) return {races:0, wins:0, raw:''};
    const m = String(rec).match(/(\d+)\s*战\s*(\d+)\s*胜/);
    if(m) return {races:+m[1], wins:+m[2], raw:String(rec)};
    return {races:0, wins:0, raw:String(rec)};
  }
  function bdVal(bd){
    if(bd == null) return 9999;
    const m = String(bd).trim().match(/^(\d{1,2})\.(\d{1,2})$/);
    if(m) return (+m[1])*31 + (+m[2]);
    return 9999;
  }
  const sexClass = {牡:'colt', 牝:'filly', セ:'geld'};
  const sexName = {牡:'牡', 牝:'牝', セ:'セ'};
  const sireClass = {'エピファネイア':'epi', 'エフフォーリア':'effo'};
  const sireLabel = {'エピファネイア':'エピファネイア（父）', 'エフフォーリア':'エフフォーリア（子）'};
  const currentYear = new Date().getFullYear();
  function horseAge(h){ return (h.year != null) ? (currentYear - h.year) : null; }
  function formatPrize(p){
    if(p == null) return '';
    if(p >= 10000) return (p/10000).toFixed(2) + '億';
    return Math.round(p).toLocaleString() + '万';
  }
  function formatTrainer(t){
    if(!t) return '';
    t = t.replace(/^\[地\]/, '地');
    if(t.length > 1 && /^[栗美地]/.test(t)) return t[0] + '・' + t.slice(1);
    return t;
  }
  const statusClass = {'現役':'active', '退役':'retired', '退役・繁殖':'breeding', '地方':'local', '未登录':'unregistered'};
  function statusBadge(s){
    if(!s) return '';
    return `<span class="status ${statusClass[s] || 'retired'}">${esc(s)}</span>`;
  }
  function horseStatus(h){
    if(h.status) return h.status;
    if(h.trainer && /^\[?地/.test(h.trainer)) return '地方';
    return '未登录';
  }
  const coatColors = {'鹿毛':'#8b5a2b','黒鹿毛':'#4a2f1b','青鹿毛':'#3e2a1e','青毛':'#1a1a1a','栗毛':'#a0522d','芦毛':'#9e9e9e','白毛':'#dcdcdc','栃栗毛':'#c48a3d'};
  function colorBadge(c){
    if(!c) return '';
    return `<span class="color-dot" style="background:${coatColors[c] || '#999'}"></span>${esc(c)}`;
  }

  // ---------- 状态 ----------
  const state = {
    q:'', sire:'全部', sex:'全部', color:'全部',
    farm:'', owner:'', trainer:'', age:'',
    winnerOnly:false,
    sortKey:null, sortDir:1,
    view:'table', page:1
  };

  // ---------- 常量（筛选用的取值） ----------
  const SIRES = ['エピファネイア','エフフォーリア'];
  const SEXES = ['牡','牝','セ'];
  const COLOR_ORDER = ['鹿毛','黒鹿毛','栗毛','青鹿毛','芦毛','青毛'];

  function distinct(key){
    const s = new Set();
    data.forEach(h => { const v = h[key]; if(v) s.add(v); });
    return [...s].sort((a,b)=>a.localeCompare(b,'ja'));
  }

  // ---------- 顶部统计 ----------
  function renderStats(){
    const epi = data.filter(h=>h.sire==='エピファネイア').length;
    const effo = data.filter(h=>h.sire==='エフフォーリア').length;
    const won = data.filter(h=>parseRec(h.rec).wins>0).length;
    document.getElementById('stats').innerHTML = `
      <span class="stat epi">🦐 店长 エピファネイア <b>${epi}</b></span>
      <span class="stat effo">息子 エフフォーリア <b>${effo}</b></span>
      <span class="stat">总产驹 <b>${data.length}</b> 匹</span>
      <span class="stat">已获胜 <b>${won}</b></span>`;
  }

  // ---------- 筛选控件 ----------
  function chipsHtml(values, stateKey, labelFn){
    const items = ['全部', ...values];
    return items.map(v => {
      const active = state[stateKey] === v;
      const label = (labelFn && labelFn(v)) || v;
      return `<button class="chip${active?' active':''}" data-v="${esc(v)}">${esc(label)}</button>`;
    }).join('');
  }
  function selectHtml(values){
    let h = `<option value="">全部</option>`;
    values.forEach(v => h += `<option value="${esc(v)}">${esc(v)}</option>`);
    return h;
  }
  function renderFilters(){
    document.getElementById('sexChips').innerHTML = chipsHtml(SEXES, 'sex');
    const colors = [...new Set([...COLOR_ORDER.filter(c=>data.some(h=>h.color===c)), ...distinct('color')])];
    document.getElementById('colorChips').innerHTML = chipsHtml(colors, 'color');

    const ages = [...new Set(data.map(h => horseAge(h)).filter(a => a != null))].sort((a,b) => a-b);
    const ageSel = document.getElementById('ageSel');
    let ageHtml = '<option value="">全部</option>';
    ages.forEach(a => ageHtml += `<option value="${a}">${a}岁</option>`);
    ageSel.innerHTML = ageHtml;
    ageSel.value = state.age;
  }

  // ---------- 筛选逻辑 ----------
  function filtered(){
    const q = state.q.trim().toLowerCase();
    return data.filter(h => {
      if(state.sire !== '全部' && h.sire !== state.sire) return false;
      if(state.sex !== '全部' && h.sex !== state.sex) return false;
      if(state.color !== '全部' && h.color !== state.color) return false;
      if(state.farm && h.farm !== state.farm) return false;
      if(state.owner && h.owner !== state.owner) return false;
      if(state.trainer && h.trainer !== state.trainer) return false;
      if(state.age && horseAge(h) !== parseInt(state.age, 10)) return false;
      if(state.winnerOnly && parseRec(h.rec).wins < 1) return false;
      if(q){
        const hay = `${h.name||''} ${h.en||''} ${h.dam||''} ${h.bms||''} ${h.farm||''} ${h.owner||''} ${h.trainer||''}`.toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function sortVal(h, key){
    if(key === 'rec'){ const p = parseRec(h.rec); return p.wins*1000 + p.races; }
    if(key === 'bd') return bdVal(h.bd);
    if(key === 'age') return (h.year != null) ? (currentYear - h.year) : 9999;
    if(key === 'prize') return (h.prize != null) ? h.prize : -1;
    return String(h[key] == null ? '' : h[key]);
  }
  function sorted(list){
    if(!state.sortKey) return list;
    const key = state.sortKey, dir = state.sortDir;
    return list.slice().sort((a,b)=>{
      if(key === 'name'){
        return String(a.name||'').localeCompare(String(b.name||''), 'ja') * dir;
      }
      const va = sortVal(a,key), vb = sortVal(b,key);
      if(va < vb) return -1*dir;
      if(va > vb) return 1*dir;
      return 0;
    });
  }

  // ---------- 表格 ----------
  const COLUMNS = [
    {key:'name',   label:'马名'},
    {key:'en',     label:'英字马名'},
    {key:'sex',    label:'性别'},
    {key:'color',  label:'毛色'},
    {key:'bd',     label:'生日'},
    {key:'age',    label:'年龄'},
    {key:'dam',    label:'母名'},
    {key:'bms',    label:'母父'},
    {key:'trainer',label:'调教师'},
    {key:'raise',  label:'募集价格'},
    {key:'auction',label:'拍卖价格'},
    {key:'prize',  label:'赏金'},
    {key:'rec',    label:'成绩'},
  ];

  const NON_SORTABLE = new Set(['sex', 'color', 'dam', 'bms', 'trainer', 'farm', 'raise', 'auction', 'rec']);
  function renderThead(){
    document.getElementById('thead').innerHTML = '<tr>' + COLUMNS.map(c => {
      const sortable = !NON_SORTABLE.has(c.key);
      const isSort = state.sortKey === c.key;
      const arr = isSort ? (state.sortDir === 1 ? '▲' : '▼') : '';
      return `<th${sortable ? ' class="sortable"' : ''} data-key="${c.key}">${c.label}<span class="arr">${arr}</span></th>`;
    }).join('') + '</tr>';
  }

  function recCell(h){
    const p = parseRec(h.rec);
    let cls = 'rec';
    if(!h.rec) cls += ' none';
    else if(p.wins > 0) cls += ' won';
    else cls += ' zero';
    return `<td class="${cls}">${h.rec ? esc(h.rec) : '—'}</td>`;
  }

  function rowHtml(h){
    const sc = sireClass[h.sire] || '';
    const xc = sexClass[h.sex] || 'geld';
    const xn = h.sex || '';
    return `<tr>
      <td><span class="nm link" data-id="${esc(h.id || h.name)}">${esc(h.name||'')}</span>${statusBadge(horseStatus(h))}</td>
      <td class="en-col">${esc(h.en||'')}</td>
      <td><span class="sex ${xc}">${esc(xn)}</span></td>
      <td>${colorBadge(h.color)}</td>
      <td>${esc(h.bd||'')}</td>
      <td>${horseAge(h) != null ? horseAge(h) + '岁' : '—'}</td>
      <td>${esc(h.dam||'')}</td>
      <td>${esc(h.bms||'')}</td>
      <td>${esc(formatTrainer(h.trainer))}</td>
      <td class="price">${esc(h.raise||'')}</td>
      <td class="price">${esc(h.auction||'')}</td>
      <td>${formatPrize(h.prize)}</td>
      ${recCell(h)}
    </tr>`;
  }

  // ---------- 卡片 ----------
  function cardHtml(h){
    const p = parseRec(h.rec);
    const sc = sireClass[h.sire] || '';
    const xc = sexClass[h.sex] || 'geld';
    let recCls = 'rec';
    if(!h.rec) recCls += ' none';
    else if(p.wins > 0) recCls += ' won';
    else recCls += ' zero';
    return `<article class="card" data-id="${esc(h.id || h.name)}">
      <div class="card-top">
        <span class="dot ${sc}"></span><span class="sire-name">${esc(h.sire||'')}</span>
        <span class="sex ${xc}">${esc(h.sex||'')}</span>
        ${h.color ? `<span class="chip" style="cursor:default">${colorBadge(h.color)}</span>` : ''}
        ${statusBadge(horseStatus(h))}
      </div>
      <div class="nm">${esc(h.name||'')}</div>
      ${h.en?`<div class="en">${esc(h.en)}</div>`:''}
      <div class="card-foot">
        <span class="${recCls}">${h.rec ? esc(h.rec) : '未出走'}</span>
      </div>
    </article>`;
  }

  // ---------- 渲染 ----------
  function render(){
    const full = sorted(filtered());
    const totalPages = Math.max(1, Math.ceil(full.length / PER_PAGE));
    if(state.page > totalPages) state.page = totalPages;
    const start = (state.page - 1) * PER_PAGE;
    const list = full.slice(start, start + PER_PAGE);
    const countEl = document.getElementById('count');
    countEl.innerHTML = `筛选出 <b>${full.length}</b> / ${data.length} 匹 · 第 <b>${state.page}</b> / <b>${totalPages}</b> 页`;

    const tableWrap = document.getElementById('tableView');
    const cardView = document.getElementById('cardView');
    const empty = document.getElementById('empty');
    const pagination = document.getElementById('pagination');

    if(!full.length){
      document.getElementById('tbody').innerHTML = '';
      cardView.innerHTML = '';
      tableWrap.hidden = state.view !== 'table';
      cardView.hidden = state.view !== 'card';
      empty.hidden = false;
      pagination.hidden = true;
      return;
    }
    empty.hidden = true;
    pagination.hidden = false;
    document.getElementById('pageInfo').textContent = `第 ${state.page} / ${totalPages} 页`;
    document.getElementById('prevPage').disabled = state.page <= 1;
    document.getElementById('nextPage').disabled = state.page >= totalPages;

    if(state.view === 'table'){
      tableWrap.hidden = false;
      cardView.hidden = true;
      document.getElementById('tbody').innerHTML = list.map(rowHtml).join('');
    } else {
      tableWrap.hidden = true;
      cardView.hidden = false;
      cardView.innerHTML = list.map(cardHtml).join('');
    }
  }

  function renderAll(){ renderStats(); renderFilters(); renderThead(); render(); }

  // ---------- 事件 ----------
  let searchTimer;
  document.getElementById('search').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.q = e.target.value; state.page = 1; render(); }, 150);
  });

  function chipClick(elId, key, value){
    state[key] = value;
    state.page = 1;
    renderFilters();
    render();
  }
  document.getElementById('sexChips').addEventListener('click', e => {
    const b = e.target.closest('[data-v]'); if(!b) return;
    chipClick('sexChips','sex', b.dataset.v);
  });
  document.getElementById('colorChips').addEventListener('click', e => {
    const b = e.target.closest('[data-v]'); if(!b) return;
    chipClick('colorChips','color', b.dataset.v);
  });

  document.getElementById('ageSel').addEventListener('change', e => { state.age = e.target.value; state.page = 1; render(); });
  document.getElementById('winnerChk').addEventListener('change', e => { state.winnerOnly = e.target.checked; state.page = 1; render(); });

  document.getElementById('resetBtn').addEventListener('click', () => {
    state.q = ''; state.sire='全部'; state.sex='全部'; state.color='全部';
    state.farm=''; state.owner=''; state.trainer=''; state.age='';
    state.winnerOnly=false; state.sortKey=null; state.page=1;
    document.getElementById('search').value = '';
    document.getElementById('winnerChk').checked = false;
    renderAll();
  });

  document.getElementById('thead').addEventListener('click', e => {
    const th = e.target.closest('th[data-key]'); if(!th) return;
    const key = th.dataset.key;
    if(NON_SORTABLE.has(key)) return;
    if(state.sortKey === key){
      state.sortDir *= -1;
    } else {
      state.sortKey = key;
      state.sortDir = (key === 'rec' || key === 'bd') ? -1 : 1;
    }
    renderThead(); state.page = 1; render();
  });

  document.querySelector('.view-toggle').addEventListener('click', e => {
    const b = e.target.closest('[data-view]'); if(!b) return;
    state.view = b.dataset.view;
    document.querySelectorAll('.view-toggle button').forEach(x => x.classList.toggle('active', x === b));
    render();
  });

  document.getElementById('prevPage').addEventListener('click', () => {
    if(state.page > 1){ state.page--; render(); window.scrollTo(0, 0); }
  });
  document.getElementById('nextPage').addEventListener('click', () => {
    state.page++; render(); window.scrollTo(0, 0);
  });

  renderAll();

  // ---------- 详情页 ----------
  function findHorse(key){
    return data.find(h => String(h.id) === String(key)) || data.find(h => h.name === key);
  }
  function renderPedTable(ped){
    if(!ped) return '';
    let level = [{n: ped.s, side: 's'}, {n: ped.d, side: 'd'}].filter(x => x.n);
    const levels = [];
    while(level.length && levels.length < 5){
      levels.push(level.map(x => ({node: x.n, side: x.side})));
      const next = [];
      level.forEach(x => {
        if(x.n && x.n.s) next.push({n: x.n.s, side: x.side});
        if(x.n && x.n.d) next.push({n: x.n.d, side: x.side});
      });
      level = next;
    }
    const total = Math.pow(2, levels.length);
    const header = '<tr>' + levels.map((_, g) => `<th>第${g + 1}代</th>`).join('') + '</tr>';
    const rows = [];
    for(let r = 0; r < total; r++){
      const cells = [];
      for(let g = 0; g < levels.length; g++){
        const span = total / Math.pow(2, g + 1);
        if(r % span === 0){
          const item = levels[g][Math.floor(r / span)];
          const link = item.node.i ? `https://db.netkeiba.com/horse/${item.node.i}/` : '#';
          cells.push(`<td rowspan="${span}" class="side-${item.side}"><a href="${link}" target="_blank" rel="noopener">${esc(item.node.n)}</a></td>`);
        }
      }
      rows.push(`<tr>${cells.join('')}</tr>`);
    }
    return `<table class="ped-table">${header}${rows.join('')}</table>`;
  }
  function openDetail(key){
    const h = findHorse(key);
    if(!h) return;
    const p = parseRec(h.rec);
    const sc = sireClass[h.sire] || '';
    const xc = sexClass[h.sex] || 'geld';
    let recCls = 'rec';
    if(!h.rec) recCls += ' none'; else if(p.wins > 0) recCls += ' won'; else recCls += ' zero';
    const nk = h.id ? `https://db.netkeiba.com/horse/${h.id}/` : '';
    const photo = h.photo ? `<div class="detail-photo"><img src="${esc(h.photo)}" alt="${esc(h.name)}" onerror="this.parentElement.style.display='none'"></div>` : '';
    const info = [
      ['种马', h.sire], ['性别', h.sex], ['毛色', h.color], ['生日', h.bd],
      ['母名', h.dam], ['母父', h.bms], ['生产牧场', h.farm], ['马主', h.owner],
      ['调教师', formatTrainer(h.trainer)], ['募集价格', h.raise], ['拍卖价格', h.auction]
    ].filter(([k,v]) => v).map(([k,v]) => `<div class="info-row"><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('');
    const ped = h.ped ? `<div class="ped-box"><h3>🌳 5代血统</h3>${renderPedTable(h.ped)}</div>` : '';
    const races = (h.races && h.races.length) ? `<div class="wins-box"><h3>🏁 比赛履历（${h.races.length}场）</h3><table class="wins-table"><thead><tr><th>日期</th><th>赛事</th><th>着順</th><th>骑手</th><th>距离</th></tr></thead><tbody>${h.races.map(r => `<tr${r.pos === '1' ? ' class="won-row"' : ''}><td>${esc(r.date||'')}</td><td>${esc(r.race||'')}</td><td>${esc(r.pos||'')}</td><td>${esc(r.jockey||'')}</td><td>${esc(r.dist||'')}</td></tr>`).join('')}</tbody></table></div>` : '';
    document.getElementById('detailBody').innerHTML = `
      <div class="detail-card">
        <div class="detail-head">
          ${photo}
          <div class="detail-main">
            <h2>${esc(h.name)}${h.en ? `<span class="en">${esc(h.en)}</span>` : ''}</h2>
            <div class="detail-badges">
              ${statusBadge(horseStatus(h))}
              <span class="sex ${xc}">${esc(h.sex||'')}</span>
              <span class="chip" style="cursor:default"><span class="dot ${sc}"></span>${esc(h.sire||'')}</span>
              ${h.color ? `<span class="chip" style="cursor:default">${colorBadge(h.color)}</span>` : ''}
            </div>
            <div class="detail-info">${info}</div>
            ${h.rec ? `<div class="detail-rec ${recCls}">成绩：${esc(h.rec)}</div>` : ''}
            ${nk ? `<a class="detail-nk" href="${nk}" target="_blank" rel="noopener">去 netkeiba 看完整资料 ↗</a>` : ''}
          </div>
        </div>
        ${ped}
        ${races}
      </div>`;
    document.body.classList.remove('show-log', 'show-tw');
    document.body.classList.add('show-detail');
    window.scrollTo(0, 0);
  }
  function closeDetail(){
    document.body.classList.remove('show-detail');
  }
  function route(){
    const m = location.hash.match(/^#\/horse\/(.+)$/);
    if(m){ openDetail(decodeURIComponent(m[1])); } else { closeDetail(); }
  }
  document.getElementById('backBtn').addEventListener('click', () => {
    history.replaceState(null, '', location.pathname + location.search);
    closeDetail();
  });
  document.getElementById('tbody').addEventListener('click', e => {
    const el = e.target.closest('[data-id]');
    if(el) location.hash = '#/horse/' + encodeURIComponent(el.dataset.id);
  });
  document.getElementById('cardView').addEventListener('click', e => {
    const el = e.target.closest('[data-id]');
    if(el) location.hash = '#/horse/' + encodeURIComponent(el.dataset.id);
  });
  window.addEventListener('hashchange', route);
  route();

  // ---------- 更新日志 ----------
  function renderChangelog(){
    const fe = (typeof 功能更新 !== 'undefined') ? 功能更新 : [];
    const de = (typeof 数据更新 !== 'undefined') ? 数据更新 : [];
    const listHtml = arr => arr.length ? arr.map(x => `<li><span class="log-date">${esc(x.date)}</span>${esc(x.text)}</li>`).join('') : '<li>暂无记录</li>';
    document.getElementById('logBody').innerHTML = `
      <h3>🛠 功能更新</h3><ul class="log-list">${listHtml(fe)}</ul>
      <h3>🔄 数据更新</h3><ul class="log-list">${listHtml(de)}</ul>`;
  }
  document.getElementById('logBtn').addEventListener('click', () => {
    document.body.classList.remove('show-detail');
    document.body.classList.add('show-log');
    renderChangelog();
    window.scrollTo(0, 0);
  });
  document.getElementById('logBackBtn').addEventListener('click', () => {
    document.body.classList.remove('show-log');
  });

  // ---------- 本周出马 ----------
  function renderThisweek(){
    const list = (typeof 本周出马 !== 'undefined') ? 本周出马 : [];
    const el = document.getElementById('thisweekBody');
    if(!list.length){
      el.innerHTML = '<p style="color:var(--muted);padding:20px 0">本周暂无产驹出赛。</p>';
      return;
    }
    const byDate = {};
    list.forEach(r => { (byDate[r.date] = byDate[r.date] || []).push(r); });
    let html = '';
    for(const date of Object.keys(byDate)){
      html += `<div class="tw-day">${esc(date)}</div>`;
      html += '<table class="tw-table"><thead><tr><th>赛事</th><th>马名</th><th>骑手</th><th>人気</th><th>着順</th><th>种马</th><th>地区</th></tr></thead><tbody>';
      byDate[date].forEach(r => {
        const sc = sireClass[r.sire] || '';
        html += `<tr>
          <td>${esc(r.race||'')}${r.status ? `<div class="tw-status">${esc(r.status)}</div>` : ''}</td>
          <td><a class="tw-name" href="#/horse/${encodeURIComponent(r.id || r.name)}">${esc(r.name||'')}</a></td>
          <td>${esc(r.jockey||'')}</td>
          <td>${esc(r.fav||'')}</td>
          <td>${esc(r.order||'')}</td>
          <td><span class="dot ${sc}"></span>${esc(r.sire||'')}</td>
          <td>${esc(r.region||'')}</td>
        </tr>`;
      });
      html += '</tbody></table>';
    }
    el.innerHTML = html;
  }
  document.getElementById('twBtn').addEventListener('click', () => {
    document.body.classList.remove('show-detail', 'show-log');
    document.body.classList.add('show-tw');
    renderThisweek();
    window.scrollTo(0, 0);
  });
  document.getElementById('twBackBtn').addEventListener('click', () => {
    document.body.classList.remove('show-tw');
  });
</script>
</body>
</html>
