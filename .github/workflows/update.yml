name: 更新产驹数据

on:
  schedule:
    # 每周一 01:30 UTC = 北京时间周一早上 09:30（比赛周末之后）
    - cron: '30 1 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # 加入母父数据（223 匹）后抓取量增加，留足余量
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4 pillow
          sudo apt-get install -y fonts-noto-cjk || true

      - name: 抓取并生成 data.js
        run: python scrape_and_build.py
        env:
          NETKEIBA_COOKIE: ${{ secrets.NETKEIBA_COOKIE }}

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "auto: 更新产驹数据"
            git fetch origin main
            # 冲突时以本次生成的数据为准（rebase 中 theirs = 当前提交）
            git rebase -X theirs origin/main || { git rebase --abort; git pull --no-rebase -X theirs origin main; }
            git push
          fi
