name: 更新本周出马

on:
  push:
    paths:
      - '.github/workflows/update_thisweek.yml'
      - 'scrape_thisweek_only.py'
      - 'scrape_and_build.py'
  schedule:
    # 中央比赛日（周六、周日）北京时间 8:00-18:00 每小时 = UTC 0:00-10:00
    - cron: '0 0-10 * * 0,6'
    # 周三、周四 北京时间 16:00 = UTC 08:00（出马表公布）
    - cron: '0 8 * * 3,4'
    # 其他日子（周一、周二、周五）每天一次 北京时间 06:30 = UTC 22:30（前一天）
    - cron: '30 22 * * 1,2,5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scrape_thisweek_only.py
        env:
          NETKEIBA_COOKIE: ${{ secrets.NETKEIBA_COOKIE }}
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thisweek.js updates.js
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "auto: 更新本周出马"
            git pull --rebase origin main
            git push
          fi
