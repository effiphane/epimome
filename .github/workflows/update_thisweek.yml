name: 更新本周出马

on:
  # 只在定时和手动触发时运行，避免改代码时的额外抓取覆盖数据
  schedule:
    # 每天 10:00（北京）：抓当天出马；周五这天同时能拿到周末出赛表和闸位
    - cron: '0 2 * * *'
    # 每天 21:00（北京）：回填当天赛果（含名次）
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - run: sudo apt-get install -y fonts-noto-cjk || true
      - run: python scrape_thisweek_only.py
        env:
          NETKEIBA_COOKIE: ${{ secrets.NETKEIBA_COOKIE }}
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "auto: 更新本周出马"
            git fetch origin main
            # 冲突时以本次生成的数据为准（rebase 中 theirs = 当前提交）
            git rebase -X theirs origin/main || { git rebase --abort; git pull --no-rebase -X theirs origin main; }
            git push
          fi
