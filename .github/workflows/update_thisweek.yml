name: 更新本周出马

on:
  push:
    paths:
      - '.github/workflows/update_thisweek.yml'
      - 'scrape_thisweek_only.py'
      - 'scrape_and_build.py'
  schedule:
    # 周五 09:00 / 11:00（北京）：出赛表 + 周六闸位（第二个为备份，防 GitHub 跳票）
    - cron: '0 1 * * 5'
    - cron: '0 3 * * 5'
    # 周六 09:00 / 11:00（北京）：周日闸位（第二个为备份）
    - cron: '0 1 * * 6'
    - cron: '0 3 * * 6'
    # 周日 19:00 / 21:00（北京）：本周结果（含名次，第二个为备份）
    - cron: '0 11 * * 0'
    - cron: '0 13 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - run: sudo apt-get install -y fonts-noto-cjk || true
      - run: python scrape_thisweek_only.py
        env:
          NETKEIBA_COOKIE: ${{ secrets.NETKEIBA_COOKIE }}
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thisweek.js updates.js weekly/ index.html
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "auto: 更新本周出马"
            git pull --rebase origin main
            git push
          fi
