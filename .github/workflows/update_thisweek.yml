name: 更新本周出马

on:
  push:
    paths:
      - '.github/workflows/update_thisweek.yml'
      - 'scrape_thisweek_only.py'
      - 'scrape_and_build.py'
  schedule:
    - cron: '30 22 * * *'  # 每天 UTC 22:30 = 北京 06:30
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scrape_thisweek_only.py
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thisweek.js
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "auto: 更新本周出马"
            git pull --rebase origin main
            git push
          fi
