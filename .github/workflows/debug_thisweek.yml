name: 调试本周出马

on:
  push:
    paths:
      - '.github/workflows/debug_thisweek.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python _debug_thisweek.py
      - name: 提交调试结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _thisweek_debug.json
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "debug: thisweek 页面结构"
            git push
          fi
